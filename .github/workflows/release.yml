name: Windows Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies and resources
        shell: powershell
        run: |
          pip install -r requirements-dev.txt
          .\scripts\fetch_third_party.ps1
          .\scripts\fetch_release_sources.ps1
          npm.cmd ci
          npm.cmd --prefix frontend ci

      - name: Verify source
        shell: powershell
        run: |
          python -m pytest -q
          python scripts\verify_resources.py
          python scripts\audit_scope.py
          python scripts\scan_secrets.py
          npm.cmd --prefix frontend run lint
          npm.cmd run desktop:check

      - name: Build Windows installers
        shell: powershell
        run: npm.cmd run dist:win

      - name: Generate checksums
        shell: powershell
        run: |
          $files = Get-ChildItem -LiteralPath dist-desktop -File | Where-Object { $_.Extension -eq ".exe" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii dist-desktop\SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist-desktop/*.exe
            dist-desktop/SHA256SUMS.txt
            release-resources/ffmpeg-8.1.2.tar.xz
            third_party/FFMPEG-BUILD.md
            third_party/THIRD_PARTY_NOTICES.md
            third_party/licenses/FFMPEG-GPL-3.0.txt
            third_party/licenses/SOURCE-HAN-OFL-1.1.txt
            third_party/licenses/YUNET-MIT.txt
